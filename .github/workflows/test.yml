name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Logic checks (no dependencies)
        run: node --test tests/regression.cjs
      - name: WordPress plugin (shortcode and build)
        run: |
          command -v php >/dev/null || { sudo apt-get update && sudo apt-get install -y php-cli; }
          php tests/plugin-test.php
          bash tests/build-test.sh
      - name: Browser smoke checks
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node --test tests/smoke.cjs
